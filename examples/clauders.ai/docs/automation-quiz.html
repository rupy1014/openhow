            ],
            answer: 2,
            explain: '뼈대는 다 같아 — 입력을 받아서, 누가 어떤 순서로 처리하고, 어떤 기준으로 확인할지. 실제 업무에서는 "앞은 동시처리, 중간은 체인, 끝은 반복개선"처럼 섞여.'
          }
        ]
      },
      {
        tag: '04',
        title: '숙제',
        source: '자동화 입문 · 숙제',
        questions: [
          {
            q: '업무 문서를 어느 수준까지 써야 하냐는 질문에 문서가 준 기준은?',
            options: [
              '한 줄로 최대한 짧게',
              '신입사원이 그 문서만 보고 첫 초안을 만들 수 있을 정도',
              '논문 수준으로 빠짐없이',
              '문서는 안 써도 되고 프롬프트로 때우면 된다'
            ],
            answer: 1,
            explain: '인수인계한다고 생각하면 돼. 세팅이 오래 걸리는 건 정상이야 — 머릿속에만 있던 기준을 밖으로 꺼내는 일이니까.'
          }
        ]
      }
    ];

    const KEYS = ['A', 'B', 'C', 'D'];
    const TOTAL = CHAPTERS.reduce((sum, chapter) => sum + chapter.questions.length, 0);

    const quizEl = document.getElementById('quiz');
    const progressEl = document.getElementById('progress');
    const scoreEl = document.getElementById('score');
    const fillEl = document.getElementById('fill');
    const resultEl = document.getElementById('result');
    const resultTitleEl = document.getElementById('result-title');
    const resultBodyEl = document.getElementById('result-body');
    const resultWeakEl = document.getElementById('result-weak');

    let answered = 0;
    let score = 0;
    const missedBy = new Map();

    function render() {
      quizEl.innerHTML = '';
      let index = 0;

      CHAPTERS.forEach((chapter) => {
        const head = document.createElement('div');
        head.className = 'chapter';
        head.innerHTML = `<span class="tag">${chapter.tag}</span><h2>${chapter.title}</h2>`;
        quizEl.appendChild(head);

        const list = document.createElement('section');
        list.className = 'quiz-list';

        chapter.questions.forEach((question) => {
          index += 1;
          const card = document.createElement('article');
          card.className = 'quiz-card';

          const optionsHtml = question.options
            .map(
              (option, i) =>
                `<button type="button" class="opt" data-index="${i}"><span class="key">${KEYS[i]}</span><span>${option}</span></button>`
            )
            .join('');

          card.innerHTML = `
            <div class="quiz-head">
              <span class="num">${index}</span>
              <h3>${question.q}</h3>
            </div>
            <div class="options">${optionsHtml}</div>
            <div class="answer">
              <p class="verdict"></p>
              <p class="explain">${question.explain}</p>
              <p><span class="source">${chapter.source}</span></p>
            </div>
          `;

          const answerEl = card.querySelector('.answer');
          const verdictEl = card.querySelector('.verdict');
          const buttons = card.querySelectorAll('.opt');

          buttons.forEach((button) => {
            button.addEventListener('click', () => {
              const picked = Number(button.dataset.index);
              const isCorrect = picked === question.answer;

              buttons.forEach((other) => {
                const i = Number(other.dataset.index);
                other.disabled = true;
                if (i === question.answer) {
                  other.classList.add('is-correct');
                } else if (i === picked) {
                  other.classList.add('is-wrong');
                } else {
                  other.classList.add('is-dim');
                }
              });

              verdictEl.textContent = isCorrect
                ? `정답! (${KEYS[question.answer]})`
                : `아쉬워. 정답은 ${KEYS[question.answer]}야.`;
              verdictEl.classList.add(isCorrect ? 'ok' : 'no');
              answerEl.classList.add('open');

              answered += 1;
              if (isCorrect) {
                score += 1;
              } else {
                missedBy.set(chapter.title, (missedBy.get(chapter.title) || 0) + 1);
              }
              updateScorebar();
            });
          });

          list.appendChild(card);
        });

        quizEl.appendChild(list);
      });
    }

    function updateScorebar() {
      progressEl.textContent = `${answered} / ${TOTAL}`;
      scoreEl.textContent = String(score);
      fillEl.style.width = `${(answered / TOTAL) * 100}%`;

      if (answered === TOTAL) {
        showResult();
      }
    }

    function showResult() {
      const rate = Math.round((score / TOTAL) * 100);
      let title;
      let body;

      if (score >= 12) {
        title = `${score} / ${TOTAL} — 자동화 감각 잡혔어`;
        body = '이제 읽는 건 끝났어. 내가 반복해서 만드는 산출물 하나 골라서 <strong>숙제</strong>로 실제 파이프라인을 돌려볼 차례야.';
      } else if (score >= 10) {
        title = `${score} / ${TOTAL} — 숙제로 넘어가도 돼`;
        body = '기준선(10개) 넘겼어. 틀린 문항만 해당 문서에서 다시 확인하고 진도 이어가.';
      } else if (score >= 7) {
        title = `${score} / ${TOTAL} — 절반은 잡혔어`;
        body = '장치 이름은 아는데 "왜 그렇게 나누는지"가 흐릿해. 틀린 챕터 문서만 다시 훑고 한 번 더 풀어봐.';
      } else {
        title = `${score} / ${TOTAL} — 문서부터 다시`;
        body = '아직 안 읽은 문서가 있을 확률이 높아. 4가지 기능부터 순서대로 읽고 다시 오면 돼.';
      }

      resultTitleEl.textContent = title;
      resultBodyEl.innerHTML = `정답률 <strong>${rate}%</strong>. ${body}`;

      const weak = [...missedBy.entries()].sort((a, b) => b[1] - a[1]);
      resultWeakEl.innerHTML = weak.length
        ? `다시 볼 문서: ${weak.map(([name, count]) => `<strong>${name}</strong>(${count}개)`).join(', ')}`
        : '틀린 문항 없음. 바로 숙제 들어가자.';

      resultEl.classList.add('open');
      resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    document.getElementById('reset').addEventListener('click', () => {
      answered = 0;
      score = 0;
      missedBy.clear();
      resultEl.classList.remove('open');
      render();
      updateScorebar();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    render();
    updateScorebar();
  </script>
</body>
</html>
